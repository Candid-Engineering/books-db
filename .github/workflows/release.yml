# Builds and releases the macOS app for playtesters. Triggered by pushing a
# version tag: bump "version" in src-tauri/tauri.conf.json, commit, then
# `git tag app-v0.2.0 && git push origin app-v0.2.0`.
#
# Apple code signing/notarization is deliberately not configured yet (see
# llm_plans/2026-08-24-auto-update-github-releases.md) - builds are ad-hoc
# signed only, so every install (including auto-updates) trips Gatekeeper's
# "unidentified developer" warning once per version. Adding real signing
# later is just adding APPLE_* secrets to this job's env, no other changes.
name: Release

on:
  push:
    tags:
      - 'app-v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]

    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      # frozen lockfile should already be the default in CI, but making sure:
      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: app-v__VERSION__
          releaseName: 'BooksDB v__VERSION__'
          releaseBody: |
            See the assets below to download and install this version.

            Builds are ad-hoc signed, not yet notarized by Apple - on first
            launch of each version (including after an auto-update),
            right-click the app and choose Open (or System Settings ->
            Privacy & Security -> "Open Anyway") to get past Gatekeeper's
            warning.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --target ${{ matrix.target }}
