# Installs dependencies and runs the JS checks (format, lint, typecheck, tests).
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Vitest CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      # - name: Install rust toolchain
      #   uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      # frozen lockfile should already be the default in CI, but making sure:
      - run: pnpm install --frozen-lockfile
      #    - run: npm run build --if-present
      - run: pnpm js:format:check
      - run: pnpm js:lint
      - run: pnpm js:typecheck
      - run: pnpm js:test run
